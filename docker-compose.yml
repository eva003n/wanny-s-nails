services:
  # ─── Infrastructure ────────────────────────────────────────

  postgres:
    image: postgres:18-alpine
    container_name: wannys-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wannys_nails
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wanny-net  
  redis:
    image: redis:7-alpine
    container_name: wannys-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wanny-net  
  # ─── API Server ───────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: wannys-api
    ports:
      - "8000:8000"
    env_file:
      - ./apps/api/.env.development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/index.js"]
    networks:
      - wanny-net  
  # ─── Workers (same image, different entry points) ─────────


  worker-notification:
    build:
      context: .
      dockerfile: apps/workers/notification/Dockerfile
    container_name: wannys-worker-notification
    env_file:
      - ./apps/api/.env.development
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - wanny-net  
  worker-payment:
    build:
      context: .
      dockerfile: apps/workers/payment/Dockerfile
    container_name: wannys-worker-payment
    env_file:
      - ./apps/api/.env.development
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - wanny-net  
  worker-reminder:
    build:
      context: .
      dockerfile: apps/workers/reminder/Dockerfile
    container_name: wannys-worker-reminder
    env_file:
      - ./apps/api/.env.development
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - wanny-net  

  # ─── Frontend (PWA) ──────────────────────────────────────

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: wannys-web
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - wanny-net  

volumes:
  postgres_data:
  redis_data:
networks:
  wanny-net:
    driver: bridge