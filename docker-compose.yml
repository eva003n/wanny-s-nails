services:
  # ─── Infrastructure ────────────────────────────────────────

  # ─── Database Migration (runs once on startup) ──────────

  db-migrate:
    build:
      context: .
      dockerfile: apps/packages/core/prisma/Dockerfile.migrate
    container_name: wannys-db-migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wanny-net

  # ─── Database Seed (runs once, after migrations succeed) ──

  db-seed:
    build:
      context: .
      dockerfile: apps/packages/core/prisma/Dockerfile.migrate
    container_name: wannys-db-seed
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    # Dockerfile's default ENTRYPOINT is `pnpm exec prisma` (for migrate
    # deploy via CMD). Seeding uses a package.json script instead, so the
    # entrypoint itself needs overriding here, not just the command.
    entrypoint: ["pnpm", "db:seed"]
    networks:
      - wanny-net

  postgres:
    image: postgres:18-alpine
    container_name: wannys-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wannys_nails
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wanny-net

  redis:
    image: redis:7-alpine
    container_name: wannys-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wanny-net

  # ─── API Server ───────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: wannys-api
    ports:
      - "8000:8000"
    environment:
      BASE_URL: ${BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}
      COOKIE_SECRET: ${COOKIE_SECRET}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET}
      DARAJA_CONSUMER_KEY: ${DARAJA_CONSUMER_KEY}
      DARAJA_CONSUMER_SECRET: ${DARAJA_CONSUMER_SECRET}
      DARAJA_SHORTCODE: ${DARAJA_SHORTCODE}
      DARAJA_PASSKEY: ${DARAJA_PASSKEY}
      DARAJA_STK_PUSH_URL: ${DARAJA_STK_PUSH_URL}
      DARAJA_CALLBACK_URL: ${DARAJA_CALLBACK_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      APP_NAME: ${APP_NAME}
      LOG_LEVEL: ${LOG_LEVEL}
      LOGTAIL_INGESTION_HOST: ${LOGTAIL_INGESTION_HOST}
      LOGTAIL_SOURCE_TOKEN: ${LOGTAIL_SOURCE_TOKEN}
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/index.js"]
    networks:
      - wanny-net

  # ─── Workers (same image, different entry points) ─────────

  worker-notification:
    build:
      context: .
      dockerfile: apps/workers/notification/Dockerfile
    container_name: wannys-worker-notification
    environment:
      NODE_ENV: ${NODE_ENV}
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      RESEND_API_KEY: ${RESEND_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL}
      LOGTAIL_INGESTION_HOST: ${LOGTAIL_INGESTION_HOST}
      LOGTAIL_SOURCE_TOKEN: ${LOGTAIL_SOURCE_TOKEN}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - wanny-net

  worker-payment:
    build:
      context: .
      dockerfile: apps/workers/payment/Dockerfile
    container_name: wannys-worker-payment
    environment:
      NODE_ENV: ${NODE_ENV}
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      DARAJA_BASE_URL: ${DARAJA_BASE_URL}
      DARAJA_CONSUMER_KEY: ${DARAJA_CONSUMER_KEY}
      DARAJA_CONSUMER_SECRET: ${DARAJA_CONSUMER_SECRET}
      DARAJA_SHORTCODE: ${DARAJA_SHORTCODE}
      DARAJA_PASSKEY: ${DARAJA_PASSKEY}
      DARAJA_STK_PUSH_URL: ${DARAJA_STK_PUSH_URL}
      DARAJA_STK_QUERY_URL: ${DARAJA_STK_QUERY_URL}
      DARAJA_CALLBACK_URL: ${DARAJA_CALLBACK_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      LOGTAIL_INGESTION_HOST: ${LOGTAIL_INGESTION_HOST}
      LOGTAIL_SOURCE_TOKEN: ${LOGTAIL_SOURCE_TOKEN}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - wanny-net

  worker-conversation:
    build:
      context: .
      dockerfile: apps/workers/conversation/Dockerfile
    container_name: wannys-worker-conversation
    environment:
      NODE_ENV: ${NODE_ENV}
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      LOG_LEVEL: ${LOG_LEVEL}
      LOGTAIL_INGESTION_HOST: ${LOGTAIL_INGESTION_HOST}
      LOGTAIL_SOURCE_TOKEN: ${LOGTAIL_SOURCE_TOKEN}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - wanny-net

  # ─── Frontend (PWA) ──────────────────────────────────────

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: wannys-web
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY}
      VITE_ENV: ${VITE_ENV}
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - wanny-net

volumes:
  postgres_data:
  redis_data:

networks:
  wanny-net:
    driver: bridge