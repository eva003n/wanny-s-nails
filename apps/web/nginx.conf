# ─────────────────────────────────────────────────────────────
#  Wanny's Nails — PWA nginx config
#  Serves the React SPA + proxies /api/* to the backend.
#  This is NOT a template — env vars are resolved by Docker
#  DNS (service names in docker-compose).
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── MIME types ────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2
        font/ttf
        font/otf;

    # ── Security headers ──────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Static assets (fingerprinted by Vite) ─────────────────
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Icons / manifest (fingerprinted or static) ────────────
    location ^~ /icons/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
        try_files $uri =404;
    }

    # ── Service worker (must NOT be cached by the browser) ────
    location ~* /(sw\.js|worker.*\.js)$ {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
        access_log off;
    }

    # ── Offline fallback page (PWA) ────────────────────────────
    location = /offline.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ── API proxy ─────────────────────────────────────────────
    # The backend container is reachable by its Docker service name.
    location /api/ {
        # Handle CORS preflight BEFORE anything else
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            add_header Access-Control-Max-Age       1728000 always;
            add_header Content-Length               0;
            return 204;
        }

        # Rewrite /api/* → /api/v1/*
        rewrite ^/api/(.*) /api/v1/$1 break;
        proxy_pass http://api:8000;

        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Don't let the browser cache API responses
        add_header Cache-Control "no-store" always;
    }

    # ── Deny fallback for known asset extensions ───────────────
    location ~ \.(js|mjs|css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf|json|ico|webp|wasm)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA fallback — anything unmatched serves index.html ───
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}